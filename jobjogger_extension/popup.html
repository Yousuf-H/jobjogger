<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <style>
      body {
        width: 400px;
        min-height: 200px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        padding: 16px;
        margin: 0;
        background: #0f172a;
        color: #f8fafc;
      }

      h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 16px;
        color: #f8fafc;
      }

      .error {
        color: #f87171;
        padding: 12px;
        background: #1e1e2e;
        border-radius: 8px;
        border: 1px solid #f8717133;
      }

      pre {
        background: #1e293b;
        padding: 12px;
        border-radius: 8px;
        overflow-x: auto;
        font-size: 12px;
        line-height: 1.6;
        color: #94a3b8;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>JobJogger</h1>
    <div id="root"></div>
    <script src="dist/popup.js"></script>
  </body>
</html>
