<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 380px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 13px;
        background: #0f172a;
        color: #f8fafc;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 16px;
        border-bottom: 1px solid #1e293b;
      }

      .header-logo {
        width: 20px;
        height: 20px;
        background: #6366f1;
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        color: white;
      }

      .header-title {
        font-size: 14px;
        font-weight: 600;
        color: #f8fafc;
      }

      .header-badge {
        margin-left: auto;
        font-size: 10px;
        font-weight: 600;
        background: #1e293b;
        color: #94a3b8;
        padding: 2px 8px;
        border-radius: 999px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .card {
        padding: 16px;
        border-bottom: 1px solid #1e293b;
      }

      .job-title {
        font-size: 15px;
        font-weight: 600;
        color: #f8fafc;
        margin-bottom: 4px;
        line-height: 1.4;
      }

      .company {
        font-size: 13px;
        color: #6366f1;
        font-weight: 500;
        margin-bottom: 8px;
      }

      .meta {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .meta-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #94a3b8;
      }

      .meta-icon {
        font-size: 11px;
      }

      .description-preview {
        margin: 12px 0 0;
        padding: 10px 12px;
        background: #1e293b;
        border-radius: 8px;
        font-size: 12px;
        color: #64748b;
        line-height: 1.5;
      }

      .description-preview.has-content {
        color: #94a3b8;
      }

      .actions {
        padding: 12px 16px;
      }

      .btn-save {
        width: 100%;
        padding: 10px;
        background: #6366f1;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }

      .btn-save:hover {
        background: #4f46e5;
      }

      .btn-save:disabled {
        background: #334155;
        color: #64748b;
        cursor: not-allowed;
      }

      .btn-already-saved {
        background: #1e293b;
        color: #34d399;
        border: 1px solid #34d39933;
      }

      .btn-already-saved:hover {
        background: #263548;
      }

      .error {
        margin: 16px;
        padding: 12px;
        background: #1e1e2e;
        border: 1px solid #f8717133;
        border-radius: 8px;
        color: #f87171;
        font-size: 13px;
        text-align: center;
        line-height: 1.5;
      }

      .status {
        padding: 12px 16px;
        font-size: 12px;
        color: #94a3b8;
        text-align: center;
      }

      .status.success {
        color: #34d399;
      }

      .status.error {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-logo">J</div>
      <span class="header-title">JobJogger</span>
      <span class="header-badge" id="source-badge"></span>
    </div>
    <div id="root"></div>
    <script src="dist/popup.js"></script>
  </body>
</html>
