<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 380px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 13px;
        background: #0f172a;
        color: #f1f5f9;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid #1e293b;
      }

      .header-logo {
        width: 26px;
        height: 26px;
        background: #6366f1;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 600;
        color: white;
        flex-shrink: 0;
      }

      .header-title {
        font-size: 14px;
        font-weight: 600;
        color: #f1f5f9;
      }

      .header-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .source-badge {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: #818cf8;
        background: #1e1b4b;
        padding: 3px 8px;
        border-radius: 4px;
        text-transform: uppercase;
      }

      .user-name {
        font-size: 12px;
        color: #475569;
      }

      .content {
        padding: 16px;
      }

      .job-header {
        margin-bottom: 14px;
      }

      .job-title {
        font-size: 16px;
        font-weight: 600;
        color: #f1f5f9;
        margin-bottom: 4px;
        line-height: 1.3;
      }

      .company-name {
        font-size: 13px;
        color: #818cf8;
      }

      .meta-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
      }

      .meta-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #94a3b8;
      }

      .meta-item svg {
        flex-shrink: 0;
      }

      .description-box {
        background: #1e293b;
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 16px;
      }

      .description-label {
        font-size: 11px;
        font-weight: 500;
        color: #475569;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 4px;
      }

      .description-text {
        font-size: 12px;
        color: #64748b;
        line-height: 1.6;
      }

      .btn {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        letter-spacing: 0.01em;
        transition: opacity 0.15s;
      }

      .btn:hover {
        opacity: 0.9;
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-primary {
        background: #6366f1;
        color: white;
      }

      .btn-saved {
        background: #0f2d1f;
        color: #34d399;
        border: 1px solid #064e3b;
      }

      .btn-signin {
        background: #6366f1;
        color: white;
      }

      .status {
        margin-top: 10px;
        font-size: 12px;
        text-align: center;
        color: #475569;
        min-height: 18px;
      }

      .status.success {
        color: #34d399;
      }

      .status.error {
        color: #f87171;
      }

      .error-state {
        padding: 24px 16px;
        text-align: center;
      }

      .error-icon {
        width: 36px;
        height: 36px;
        background: #1e293b;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 12px;
      }

      .error-title {
        font-size: 13px;
        font-weight: 600;
        color: #f1f5f9;
        margin-bottom: 6px;
      }

      .error-message {
        font-size: 12px;
        color: #475569;
        line-height: 1.6;
      }

      .signin-state {
        padding: 24px 16px;
        text-align: center;
      }

      .signin-message {
        font-size: 13px;
        color: #64748b;
        margin-bottom: 16px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-logo">J</div>
      <span class="header-title">JobJogger</span>
      <div class="header-right" id="header-right"></div>
    </div>
    <div id="root"></div>
    <script src="dist/popup.js"></script>
  </body>
</html>
