default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: jobjogger_api_development
  username: <%= ENV.fetch("JOBJOGGER_API_DATABASE_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("JOBJOGGER_API_DATABASE_PASSWORD") { "postgres" } %>
  host: <%= ENV.fetch("JOBJOGGER_API_DATABASE_HOST") { "postgres" } %>

test:
  <<: *default
  database: jobjogger_api_test
  username: <%= ENV.fetch("JOBJOGGER_API_TEST_DATABASE_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("JOBJOGGER_API_TEST_DATABASE_PASSWORD") { "postgres" } %>
  host: <%= ENV.fetch("JOBJOGGER_API_TEST_DATABASE_HOST") { "postgres" } %>

production:
  <<: *default
  database: jobjogger_api_production
  username: <%= ENV.fetch("JOBJOGGER_API_DATABASE_USERNAME") { "postgres" } %>
  password: <%= ENV["JOBJOGGER_API_DATABASE_PASSWORD"] %>
  host: <%= ENV["JOBJOGGER_API_DATABASE_HOST"] %>
  port: <%= ENV.fetch("JOBJOGGER_API_DATABASE_PORT") { 5432 } %>
